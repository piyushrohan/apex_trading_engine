name: APEX Nightly Validation

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:
  heavy-simulation-and-replay:
    name: Deterministic Historical Replay & Data Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Long-running job
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.10'

      - name: Run Data Integrity & Replay Tests
        run: pytest tests/ -v -m "replay or slow" --cov=src --cov-report=xml

      - name: Upload Deep Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-report
          path: coverage.xml
          retention-days: 30 # Longer retention for nightly

      - name: Upload Test Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-test-logs
          path: .pytest_cache/
          retention-days: 30

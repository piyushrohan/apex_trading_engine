name: APEX Nightly Validation

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heavy-simulation-and-replay:
    name: Deterministic Historical Replay & Data Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Long-running job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
        
      - name: Run Data Integrity & Replay Tests
        run: pytest tests/ -v -m "replay or slow" --cov=src --cov-report=xml
        
      - name: Upload Deep Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-report
          path: coverage.xml
          retention-days: 30 # Longer retention for nightly

      - name: Upload Test Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-test-logs
          path: .pytest_cache/
          retention-days: 30

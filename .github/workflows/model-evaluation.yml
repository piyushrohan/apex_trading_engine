name: APEX Model Evaluation Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # Runs 1 hour after nightly validation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:
  evaluate-models:
    name: Model Evaluation & Benchmarking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.10'
      - name: Rolling Retraining
        run: python -m src.mlops.auto_retrain
      - name: Walk-Forward Validation
        run: pytest tests/mlops tests/models tests/pipelines/test_backtest_edges.py -q
      - name: Promotion Scoring
        run: pytest tests/mlops/test_promotion_service.py -q
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-evaluation-artifacts
          path: |
            data_lake/models/**
            data_lake/hedge_bandit/training/decisions.jsonl
          if-no-files-found: ignore

name: APEX Paper Trading Validation

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Duration to run paper trading'
        required: true
        default: '24'

jobs:
  paper-trading:
    name: Paper Trading Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run bounded paper validation tests
        run: pytest tests/integration/test_paper_e2e.py tests/pipelines/test_paper_trade.py -q
      - name: Generate paper report
        run: python -m src.reports.paper_report --config configs/base.yaml > paper_report.json
      - name: Generate hedge report
        run: python -m src.reports.hedge_report --config configs/base.yaml > hedge_report.json
      - name: Archive journals and reports
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-validation
          path: |
            data_lake/trade_journal.jsonl
            data_lake/hedge_bandit/training/decisions.jsonl
            paper_report.json
            hedge_report.json
          if-no-files-found: ignore

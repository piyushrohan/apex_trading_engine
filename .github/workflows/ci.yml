name: APEX Institutional Pipeline

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:
  security-and-lint:
    name: Code & Dependency Security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.10'
      - name: Bandit Security Scan
        run: bandit -r src/ -ll -ii
      - name: Safety Dependency Scan (advisory)
        continue-on-error: true
        run: safety check -r requirements.txt
      - name: Flake8 Linting
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Frontend Cockpit Static Checks
        run: |
          node --check frontend/app.js
          node --test tests/frontend/*.test.mjs

  typecheck:
    name: Mypy Strict Typechecking
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.10'
      - name: Mypy Check (advisory)
        continue-on-error: true
        run: mypy src/ --ignore-missing-imports

  risk-engine-gate:
    name: 🚨 Risk Engine Safety Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [security-and-lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.10'
      - name: Run Risk & Kill-Switch Tests
        run: pytest tests/ -v -m "risk"

  core-tests:
    name: Core Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [security-and-lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.10'

      - name: Run Core Logic Tests
        run: pytest tests/ -v -m "unit or integration or mlops or chaos"

      - name: Granular Coverage Enforcement (Execution/Risk)
        run: pytest tests/ -m "unit or risk" --cov=src/execution --cov-fail-under=95

      - name: Global Coverage Enforcement
        run: pytest tests/ -v --cov=src --cov-fail-under=95 --cov-report=xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

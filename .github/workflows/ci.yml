name: APEX Institutional Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-lint:
    name: Code & Dependency Security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Bandit Security Scan
        run: bandit -r src/ -ll -ii
      - name: Safety Dependency Scan
        # Phase 1 targeted ignore: allowing temporarily while we upgrade numpy/pandas
        run: safety check -r requirements.txt || true
      - name: Flake8 Linting
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  typecheck:
    name: Mypy Strict Typechecking
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Mypy Check
        # Phase 1: Not enforcing strict yet
        run: mypy src/ --ignore-missing-imports || true

  risk-engine-gate:
    name: 🚨 Risk Engine Safety Gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [security-and-lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run Risk & Kill-Switch Tests
        run: pytest tests/ -v -m "risk"

  core-tests:
    name: Core Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: risk-engine-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
        
      - name: Run Core Logic Tests
        run: pytest tests/ -v -m "unit or integration or mlops or chaos"
        
      - name: Granular Coverage Enforcement (Execution/Risk)
        run: pytest tests/ -m "unit or risk" --cov=src/execution --cov-fail-under=95
        
      - name: Global Coverage Enforcement
        run: pytest tests/ -v --cov=src --cov-fail-under=85 --cov-report=xml
        
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

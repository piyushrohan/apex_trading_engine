name: APEX Continuous Integration

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Dependency Security Scan (safety)
      run: |
        safety check -r requirements.txt || echo "Ignoring safety errors for now"

    - name: Code Security Scan (bandit)
      run: |
        bandit -r src/ -ll -ii

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type Check (mypy)
      run: |
        mypy src/ --ignore-missing-imports || echo "Ignoring mypy strict errors for now"

    - name: Run Unit Tests & Coverage
      run: |
        # Run pytest with coverage. Enforcing 85% overall, and 95% on core modules.
        # We will build up to this strict enforcement.
        pytest tests/ -v --cov=src --cov-fail-under=85 --cov-report=term-missing

[pytest]
pythonpath = .
markers =
    unit: Fast unit tests for core business logic (milliseconds).
    integration: Component interaction tests with mocked local infra.
    replay: Historical deterministic simulation tests for edge detection.
    slow: Long-running paper trading or heavy data tests.
    risk: Safety critical execution, sizing, and kill-switch tests. MUST PASS FIRST.
    mlops: Model evaluation, state transitions, and registry tests.
    chaos: System failure, disconnect, and catastrophe simulations.

version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data_test:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apex_test_network

  timescaledb:
    image: timescale/timescaledb:latest-pg14
    environment:
      POSTGRES_USER: apex_test_user
      POSTGRES_PASSWORD: apex_test_password
      POSTGRES_DB: apex_test_db
    ports:
      - "5432:5432"
    volumes:
      - tsdb_data_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex_test_user -d apex_test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - apex_test_network

networks:
  apex_test_network:
    driver: bridge

volumes:
  redis_data_test:
  tsdb_data_test:
